<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ball Runner</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <main>
    <h1>Ball Runner</h1>
    <canvas id="game" width="960" height="480"></canvas>
    <p class="help">
      <kbd>&larr;</kbd> <kbd>&rarr;</kbd> move &nbsp;·&nbsp;
      <kbd>&uarr;</kbd> or <kbd>Space</kbd> jump (again in the air to double jump) &nbsp;·&nbsp;
      <kbd>R</kbd> restart level &nbsp;·&nbsp;
      <kbd>N</kbd> skip level &nbsp;·&nbsp; <kbd>B</kbd> previous level &nbsp;·&nbsp;
      <kbd>D</kbd> double jump on/off<br>
      Stomp slimes, dodge spikes, pits, rolling wheels and homing mines, beat the bosses on levels 3 and 6!
    </p>
  </main>
  <script src="game.js?v=3"></script>
</body>
</html>
